<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI KOL 达人匹配助手</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="layout">
        <!-- 左侧导航栏 -->
        <nav class="sidebar">
            <div class="logo">
                <span class="logo-icon">KOL</span>
                <span class="logo-text">达人匹配</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active"><a href="index.html">首页推荐</a></li>
                <li class="nav-item"><a href="explore.html">达人库</a></li>
                <li class="nav-item"><a href="history.html">历史记录</a></li>
                <li class="nav-item"><a href="settings.html">设置</a></li>
            </ul>
        </nav>

        <!-- 主内容区 -->
        <main class="main-content">
            <header class="topbar">
                <h1>AI KOL / 达人匹配助手</h1>
                <p>输入投放需求，AI 自动推荐最合适的达人</p>
            </header>

            <div class="content-grid">
                <!-- 左侧表单 -->
                <section class="form-section" id="formSection">
                    <button class="collapse-btn" onclick="toggleSidebar()" title="收起表单">◀</button>
                    <div class="card">
                        <h2>投放需求</h2>
                        <form id="demandForm">
                            <!-- 目标受众：切换模式 -->
                            <div class="form-group">
                                <label class="form-label">目标受众</label>
                                <div class="audience-toggle">
                                    <button type="button" id="btnSplit" class="active" onclick="switchAudienceMode('split')">拆分填写</button>
                                    <button type="button" id="btnFree" onclick="switchAudienceMode('free')">自由输入</button>
                                </div>

                                <!-- 拆分输入 -->
                                <div id="audienceSplit">
                                    <div class="audience-grid">
                                        <div class="form-field">
                                            <label>性别</label>
                                            <div class="radio-group">
                                                <label class="radio"><input type="radio" name="gender" value="不限" checked> 不限</label>
                                                <label class="radio"><input type="radio" name="gender" value="男"> 男</label>
                                                <label class="radio"><input type="radio" name="gender" value="女"> 女</label>
                                            </div>
                                        </div>
                                        <div class="form-field">
                                            <label>年龄</label>
                                            <div class="range-inputs">
                                                <input type="number" id="age_min" value="18">
                                                <span>-</span>
                                                <input type="number" id="age_max" value="25">
                                            </div>
                                        </div>
                                        <div class="form-field full-width">
                                            <label>职业/身份</label>
                                            <input type="text" id="occupation" value="大学生">
                                        </div>
                                    </div>
                                </div>

                                <!-- 自由输入 -->
                                <div id="audienceFree" style="display:none;">
                                    <textarea class="free-text-area" id="freeText" placeholder="粘贴你的产品策划案或需求描述，AI 自动提取信息..."></textarea>
                                    <button type="button" class="btn-secondary" style="margin-top:8px; width:auto; padding:8px 16px;" onclick="parseDemand()">🔍 自动解析</button>
                                    <div id="parseResult"></div>
                                </div>
                            </div>

                            <!-- 内容领域 -->
                            <div class="form-group">
                                <label class="form-label">内容领域</label>
                                <input type="text" id="content_field" value="校园">
                            </div>

                            <!-- 预算范围 -->
                            <div class="form-group">
                                <label class="form-label">预算范围（元/达人）</label>
                                <div class="range-inputs">
                                    <input type="number" id="budget_min" value="1000" min="500">
                                    <span>-</span>
                                    <input type="number" id="budget_max" value="3000" max="50000">
                                </div>
                            </div>

                            <!-- 投放配置：模式切换 + 动态输入 -->
                            <div class="form-group">
                                <label class="form-label">投放配置</label>
                                <div class="mode-toggle">
                                    <input type="radio" name="alloc_mode" id="mode_auto" value="auto" checked>
                                    <label for="mode_auto">自动推荐</label>
                                    <input type="radio" name="alloc_mode" id="mode_num" value="num">
                                    <label for="mode_num">按人数</label>
                                    <input type="radio" name="alloc_mode" id="mode_roi" value="roi">
                                    <label for="mode_roi">按ROI</label>
                                </div>
                                <div class="budget-row">
                                    <div class="form-field">
                                        <label>总预算（元）<span class="required">*</span></label>
                                        <input type="number" id="total_budget" value="15000" min="1000">
                                    </div>
                                    <div class="form-field" id="field_num_kols" style="display:none;">
                                        <label>合作人数</label>
                                        <input type="number" id="num_kols" placeholder="如 5" min="1" max="10">
                                    </div>
                                    <div class="form-field" id="field_target_roi" style="display:none;">
                                        <label>期望 ROI（1:X）</label>
                                        <input type="number" id="target_roi" placeholder="如 3" step="0.1" min="0.5">
                                    </div>
                                </div>
                            </div>

                            <!-- 投放平台 -->
                            <div class="form-group">
                                <label class="form-label">投放平台 <span class="required">*</span></label>
                                <div class="platform-tags" id="platformTags">
                                    <label class="platform-tag xhs" onclick="togglePlatform(this)">
                                        <input type="checkbox" name="platforms" value="小红书"> 小红书
                                    </label>
                                    <label class="platform-tag dy" onclick="togglePlatform(this)">
                                        <input type="checkbox" name="platforms" value="抖音"> 抖音
                                    </label>
                                    <label class="platform-tag bz" onclick="togglePlatform(this)">
                                        <input type="checkbox" name="platforms" value="B站"> B站
                                    </label>
                                    <label class="platform-tag wb" onclick="togglePlatform(this)">
                                        <input type="checkbox" name="platforms" value="微博"> 微博
                                    </label>
                                </div>
                            </div>

                            <!-- 高级筛选 -->
                            <div class="form-group">
                                <button type="button" class="toggle-btn" onclick="toggleAdvanced()">高级筛选 ▼</button>
                                <div id="advancedPanel" class="advanced-panel" style="display:none;">
                                    <div class="form-row">
                                        <div class="form-field">
                                            <label>最低互动率 (%)</label>
                                            <input type="number" id="engagement_rate_min" value="3.0" step="0.1">
                                        </div>
                                        <div class="form-field">
                                            <label>最低转化率 (%)</label>
                                            <input type="number" id="conversion_rate_min" placeholder="不限" step="0.1">
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-field">
                                            <label>粉丝数下限</label>
                                            <input type="number" id="followers_min" placeholder="如 50000">
                                        </div>
                                        <div class="form-field">
                                            <label>粉丝数上限</label>
                                            <input type="number" id="followers_max" placeholder="如 200000">
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-field">
                                            <label>风险偏好</label>
                                            <select id="risk_preference">
                                                <option value="保守">保守</option>
                                                <option value="平衡" selected>平衡</option>
                                                <option value="激进">激进</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 快捷需求 -->
                            <div class="quick-tags">
                                <span class="quick-label">快捷需求：</span>
                                <span class="quick-tag" onclick="fillForm('campus')">校园推广</span>
                                <span class="quick-tag" onclick="fillForm('beauty')">美妆新品</span>
                                <span class="quick-tag" onclick="fillForm('workplace')">职场课程</span>
                                <span class="quick-tag" onclick="fillForm('mother')">母婴产品</span>
                            </div>

                            <button type="submit" class="btn-primary">
                                <span class="btn-text">开始推荐</span>
                                <span class="spinner" style="display:none;"></span>
                            </button>
                        </form>
                    </div>
                </section>

                <!-- 右侧结果 -->
                <section class="result-section">
                    <div id="resultArea">
                        <div class="empty-state">
                            <div class="empty-icon">🔍</div>
                            <h3>开始你的达人推荐</h3>
                            <p>在左侧填写投放需求，AI 将为你匹配最合适的达人</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
